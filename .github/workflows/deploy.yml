name: Deploy to WordPress.org

on:
  release:
    types: [published]

permissions:
  contents: write # attach the built zip to the release

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No composer install: the plugin has no runtime dependencies and ships
      # its own PSR-4 autoloader (autoload.php), so vendor/ is dev-only and
      # excluded from the package via .distignore.

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
          SLUG: privacy-captcha-for-cap
          GENERATE_ZIP: true
          # The icon/banner live in .wordpress-org/assets. Without this the
          # action defaults ASSETS_DIR to .wordpress-org and copies the whole
          # assets/ subdir into SVN assets/ → nested assets/assets/ (broken art).
          ASSETS_DIR: .wordpress-org/assets

      # Without this the Releases page only offers GitHub's auto-generated
      # source archive, which is not an installable plugin.
      - name: Attach the built zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP: ${{ steps.deploy.outputs.zip-path }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ZIP" --clobber
